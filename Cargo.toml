[package]
name = "bevi-knight"
version = "0.1.1"
edition = "2024"
description = "A from-scratch single-player reconstruction of Star Wars Jedi Knight: Dark Forces II, reading the retail install's archives and executable tables"
repository = "https://github.com/tigwyk/rust-jediknight"
license = "GPL-3.0-or-later"
readme = "README.md"
rust-version = "1.97.1"

[dependencies]
# `wav` enables the WAV decoder: Bevy's default `audio` feature only ships Vorbis,
# and every one of the game's 644 sound files is 22 kHz 16-bit PCM WAV.
bevy = { version = "0.20", features = ["wav"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
